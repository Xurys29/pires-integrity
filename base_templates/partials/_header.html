<header class="app-header">
    <div class="header-inner">
        <a href="/" class="brand" aria-label="Pires Integridade — início">
            <strong>PIRES <span>INTEGRIDADE</span></strong>
            <small>Engenharia e integridade de ativos</small>
        </a>

        <nav class="app-nav" aria-label="Navegação principal">
            <a href="/">Início</a>

            {% if user.is_authenticated %}
                {% if user.is_staff %}
                    <a href="{% url 'admin:index' %}">
                        Administração
                    </a>
                {% endif %}
            {% else %}
                <a href="{% url 'admin:login' %}">
                    Entrar
                </a>
            {% endif %}
        </nav>

        {% if user.is_authenticated %}
            <div class="header-actions">
                <span>
                    Olá,
                    {{ user.get_full_name|default:user.get_username }}
                </span>
            </div>
        {% endif %}
    </div>
</header>
